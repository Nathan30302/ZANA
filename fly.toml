# Optional Fly.io deploy for apps/api (region jnb ≈ Southern Africa)
# Prerequisites: flyctl auth login, then:
#   fly apps create zana-api
#   fly postgres create --name zana-db --region jnb
#   fly postgres attach zana-db -a zana-api
#   fly secrets set JWT_SECRET=... OTP_PROVIDER=africas_talking AT_USERNAME=... AT_API_KEY=... PUBLIC_BASE_URL=https://zana-api.fly.dev CORS_ORIGINS=*
#   fly deploy

app = 'zana-api'
primary_region = 'jnb'

[build]
  dockerfile = 'apps/api/Dockerfile'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/v1/health'

[env]
  NODE_ENV = 'production'
  PORT = '3000'
  OTP_PROVIDER = 'africas_talking'
  PAYMENT_PROVIDER = 'stub'
  PAYMENT_SIMULATE = 'true'
